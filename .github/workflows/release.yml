name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: VoiceHubLanDesktop.csproj

jobs:
  build:
    name: Build and package .laapp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      # AirApp SDK 发布在 GitHub Packages，读取也需要认证。
      # 仓库需要配置一个带 read:packages 权限的 PAT 作为 LANMOUNTAIN_PACKAGES_TOKEN。
      # 源地址的真源是本仓库的 NuGet.config（那里已经登记了名为 lanmountain 的源）。
      # 这里只给它补凭据，不许再 add source：add 撞上同名源会直接失败
      # （实测报 "The name specified has already been added to the list of available package sources."，
      # 整条流水线在 Restore 之前就红）。update source 是幂等的，--configfile 指到仓库那份 NuGet.config，
      # 只往 packageSourceCredentials 里写用户名与口令，不动源地址。
      - name: Attach credentials to the LanMountain package source
        run: >
          dotnet nuget update source lanmountain
          --source https://nuget.pkg.github.com/wwiinnddyy/index.json
          --username ${{ github.actor }}
          --password ${{ secrets.LANMOUNTAIN_PACKAGES_TOKEN }}
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      # 构建即打包：AirApp SDK 的 MSBuild target 产出 .laapp。
      - name: Build and package
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Upload .laapp
        uses: actions/upload-artifact@v7
        with:
          name: voicehub-airapp
          path: '*.laapp'
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.laapp'
          generate_release_notes: true
